name: Collect Nostr zap receipts

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Completed UTC days to refresh (blank uses 30 initially, then 3)"
        required: false
        type: string
  schedule:
    # Offset from the SN workflow so the two jobs are unlikely to push together.
    - cron: "47 10 * * *"

permissions:
  contents: write

concurrency:
  group: collect-nostr-zaps
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-nostr.txt

      - name: Install pinned Nostr dependencies
        run: python -m pip install --requirement requirements-nostr.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect and summarize
        id: collection
        env:
          REQUESTED_DAYS: ${{ inputs.days }}
        run: |
          status=0
          if [ -n "$REQUESTED_DAYS" ]; then
            python scripts/collect_nostr_zaps.py --days "$REQUESTED_DAYS" || status=$?
          else
            python scripts/collect_nostr_zaps.py || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python scripts/summarize_nostr_zaps.py
          fi
          python scripts/audit_nostr_relays.py
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Commit changed Nostr data
        if: always()
        run: |
          git config user.name "Nostr Stats Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nostr/
          if git diff --cached --quiet; then
            echo "No Nostr data changes"
            exit 0
          fi
          git commit -m "Update Nostr zap statistics"
          git pull --rebase origin main
          git push origin main

      - name: Fail after preserving diagnostics
        if: always() && (steps.collection.outcome != 'success' || steps.collection.outputs.status != '0')
        run: |
          echo "Collection did not meet its safety or coverage requirements. Diagnostics were preserved."
          exit 1
