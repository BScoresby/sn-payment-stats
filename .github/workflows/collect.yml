name: Collect SN stats

on:
  workflow_dispatch:
  schedule:
    # 4:17 a.m. or 5:17 a.m. America/Chicago, depending on daylight saving time.
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: collect-sn-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect and summarize
        run: python scripts/run_pipeline.py

      - name: Show social recap drafts
        run: |
          for recap in daily friday; do
            if [[ "$recap" == "daily" ]]; then
              title="Daily recap draft"
            else
              title="Latest Friday recap draft"
            fi
            echo "## $title" >> "$GITHUB_STEP_SUMMARY"
            if [[ ! -f "data/recaps/latest_${recap}.md" ]]; then
              echo "> No safe $recap recap was generated. Check the collection log." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            cat "data/recaps/latest_${recap}.md" >> "$GITHUB_STEP_SUMMARY"
            if [[ -f "data/recaps/latest_${recap}.json" ]] && \
               [[ "$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["quality_status"])' "data/recaps/latest_${recap}.json")" != "ok" ]]; then
              echo "> **Review required:** this recap contains an anomaly advisory. Check the JSON diagnostics before posting." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Commit changed data
        run: |
          git config user.name "SN Stats Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update SN statistics"
          git push
